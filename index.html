<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePay - Detalles de Pago</title>
    
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 position-relative">

<div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<nav class="navbar navbar-expand-lg fixed-top glass-panel navbar-dark py-2" style="border-radius: 0 0 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="container">
        <a class="navbar-brand fs-4 fw-bold text-white tracking-wide" href="#">Secure<span style="color: #c084fc;">Pay</span></a>
        
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link text-white-50 fw-light mx-2 custom-nav-link" href="#">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link text-white-50 fw-light mx-2 custom-nav-link" href="#">Ofertas</a></li>
                <li class="nav-item"><a class="nav-link text-white-50 fw-light mx-2 custom-nav-link" href="#">Mis Pedidos</a></li>
                
                <li class="nav-item ms-lg-4 mt-3 mt-lg-0">
                    <a class="nav-link glass-btn px-4 py-1 rounded-pill text-white d-flex align-items-center gap-2" href="#">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="fw-semibold tracking-wide">$ 0.00</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center" style="padding-top: 100px; padding-bottom: 40px;">
    <div class="row w-100 justify-content-center align-items-center gap-4 gap-lg-5">
        
        <div class="col-12 col-xl-5 d-flex justify-content-center">
            <div class="card-section">
                <div class="secure-card" id="card">
                    
                    <div class="card-front glass-panel">
                        <div class="d-flex justify-content-between align-items-center">
                            <svg class="card-chip" viewBox="0 0 50 40" width="45" height="35" xmlns="http://www.w3.org/2000/svg">
                                <rect width="50" height="40" rx="6" fill="#e5c158" />
                                <path d="M0 12h12v16H0zM38 12h12v16H38zM12 0h26v12H12zM12 28h26v12H12z" fill="#d4af37" opacity="0.8"/>
                                <path d="M12 0v40M38 0v40M0 12h50M0 28h50M12 20h26" stroke="#9e7b23" stroke-width="1.5" fill="none"/>
                                <rect x="18" y="14" width="14" height="12" rx="2" fill="#f3d573" />
                            </svg>
                            <svg class="nfc-icon-img" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 10.5a2.5 2.5 0 0 1 0 3"/><path d="M8 8.5a6.5 6.5 0 0 1 0 7"/><path d="M12 6.5a10.5 10.5 0 0 1 0 11"/><path d="M16 4.5a14.5 14.5 0 0 1 0 15"/>
                            </svg>
                        </div>
                        
                        <div class="card-number-display" id="card-num-display">.... .... .... ....</div>
                        
                        <div class="card-footer-info">
                            <div>
                                <span class="label">TITULAR</span>
                                <div id="card-name-display" class="value text-truncate" style="max-width: 180px;">NOMBRE COMPLETO</div>
                            </div>
                            <div>
                                <span class="label">EXPIRACIÓN</span>
                                <div id="card-exp-display" class="value">MM/YY</div>
                            </div>
                        </div>
                        <div class="bank-logo-container" id="bank-logo-display"></div>
                    </div>

                    <div class="card-back glass-panel">
                        <div class="magnetic-strip"></div>
                        <div class="back-body">
                            <div class="signature-row">
                                <div class="world-icon">
                                    <svg viewBox="0 0 24 24" width="28" fill="#cbd5e1"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                </div>
                                <div class="white-bar-container">
                                    <div class="signature-fill"><span id="card-last-digits">####</span></div>
                                    <div class="cvv-box-display" id="card-cvv-display">000</div>
                                </div>
                                <span class="cvv-text-label ms-2">CVV</span>
                            </div>
                            <p class="legal-text">Esta tarjeta es propiedad del banco emisor y es intransferible.</p>
                            <div class="logo-banco-back" id="bank-logo-back-display"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-8 col-xl-5">
            <div class="payment-form glass-panel p-4 p-md-5 rounded-4 shadow-lg">
                <h2 class="text-center mb-4 fw-light text-white">Detalles de Pago</h2>
                
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Monto de Pago</label>
                    <input type="text" id="input-amount" class="form-control glass-input" placeholder="$ 0.00">
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Número de Tarjeta</label>
                    <input type="text" id="input-number" class="form-control glass-input" maxlength="19" placeholder="1234 3478 9876 3657">
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-white-50 small">Titular de la Tarjeta</label>
                    <input type="text" id="input-name" class="form-control glass-input" placeholder="Nombre Completo">
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-8">
                        <label class="form-label text-white-50 small">Fecha de Expiración</label>
                        <div class="d-flex gap-2">
                            <select id="select-day" class="form-select glass-input">
                                <option value="" disabled selected>Mes</option>
                            </select>
                            <select id="select-year" class="form-select glass-input">
                                <option value="" disabled selected>Año</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-4">
    <label class="form-label text-white-50 small">CVV</label>
    <div class="position-relative">
        <input type="password" id="input-cvv" class="form-control glass-input pe-5" maxlength="3" placeholder="123">
        
        <button type="button" id="toggle-cvv" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent" style="margin-right: 5px;">
            <i class="bi bi-eye-slash text-white-50" id="eye-icon"></i>
        </button>
    </div>
</div>

                <button class="btn pay-button w-100 py-3 mt-5 rounded-3 text-white fw-bold">Pagar Ahora</button>
            </div>
        </div>
        
    </div>
</main>

<footer class="glass-panel py-3 mt-auto" style="border-radius: 20px 20px 0 0; border-top: 1px solid rgba(255,255,255,0.1);">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        
        <div class="footer-brand d-flex align-items-center gap-2">
            <span class="fs-6 fw-light text-white-50">&copy; 2026</span>
            <span class="fw-light text-white-50">|</span>
            <span class="text-white-50 fw-light fs-6">Desarrollado con <span class="text-danger">&hearts;</span> por <strong class="fw-bold" style="color: #c084fc; letter-spacing: 0.5px;">[Tu Nombre]</strong></span>
        </div>
        
        <div class="social-links d-flex gap-4">
            <a href="#" class="footer-link" title="GitHub">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            </a>
            <a href="#" class="footer-link" title="LinkedIn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            </a>
            <a href="#" class="footer-link" title="Portafolio">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            </a>
        </div>
        
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/script.js"></script>
</body>
</html>
