<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePay - Detalles de Pago</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

    <header>
        <div class="logo">Secure<span>Pay</span></div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Soporte</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="card-visual-container">
            <div class="card-visual" id="card-visual">
                
                <div class="card-face card-front">
                    <div class="top-row">
                        <div class="chip"></div>
                        <div class="logo-banco" id="logo-banco-front"></div>
                    </div>
                    <div class="card-number-display" id="display-numero">#### #### #### ####</div>
                    <div class="card-details-display">
                        <div>
                            <span class="label">TITULAR</span>
                            <div id="display-nombre">NOMBRE COMPLETO</div>
                        </div>
                        <div>
                            <span class="label">EXPIRACIÓN</span>
                            <div id="display-fecha">MM/YY</div>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="magnetic-strip"></div>
                    <div class="signature-strip-container">
                        <div class="globe-icon"></div>
                        <div class="signature-display" id="display-firma-numero">####</div>
                        <div class="cvv-display" id="display-cvv">000</div>
                        <div class="cvv-label-text">CVV</div>
                    </div>
                    <p class="legal-text">Esta tarjeta es propiedad del banco emisor y es intransferible.</p>
                    
                    <div class="logo-banco-back" id="logo-banco-back"></div>
                </div>

            </div>
        </div>

        <div class="form-section">
            <h1>Detalles de Pago</h1>
            
            <div class="form-group">
                <label>Monto de Pago</label>
                <input type="text" class="form-control" value="$" placeholder="$">
            </div>

            <div class="form-group">
                <label>Número de Tarjeta</label>
                <input type="text" class="form-control" id="input-numero" placeholder="1234 5678 9876 5432" maxlength="19">
            </div>

            <div class="form-group">
                <label>Titular de la Tarjeta</label>
                <input type="text" class="form-control" id="input-nombre" placeholder="Nombre Completo">
            </div>

            <div class="row">
                <div class="col" style="flex: 2;">
                    <label>Fecha de Expiración</label>
                    <div class="row">
                        <select class="form-control" id="input-mes">
                            <option value="">Mes</option>
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <select class="form-control" id="input-anio">
                            <option value="">Año</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>
                            <option value="30">30</option>
                        </select>
                    </div>
                </div>
                <div class="col" style="flex: 1;">
                    <label>CVV</label>
                    <input type="text" class="form-control" id="input-cvv" placeholder="000" maxlength="4">
                </div>
            </div>

            <button class="btn-submit">Pagar Ahora</button>
        </div>
    </main>

    <script src="./assets/js/script.js"></script>
</body>
</html>
