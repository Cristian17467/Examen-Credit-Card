<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Pago</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="payment-box">
            
            <div class="card-container">
                <div class="card" id="card">
                    <div class="card-face front">
                        <div class="chip-icon">💳</div>
                        <div class="card-number" id="v-number">#### #### #### ####</div>
                        <div class="card-info">
                            <div class="info-group">
                                <span>TITULAR</span>
                                <div id="v-name">NOMBRE COMPLETO</div>
                            </div>
                            <div class="info-group">
                                <span>EXPIRACION</span>
                                <div id="v-expiry">MM/YY</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-face back">
                        <div class="magnetic-strip"></div>
                        <div class="cvv-bar">
                            <span id="v-cvv">000</span>
                        </div>
                        <p class="disclaimer">Esta tarjeta es propiedad del banco emisor...</p>
                    </div>
                </div>
            </div>

            <div class="form-container">
                <h2>Detalles de Pago</h2>
                <div class="input-group">
                    <label>Monto de Pago</label>
                    <input type="text" placeholder="$">
                </div>
                <div class="input-group">
                    <label>Número de Tarjeta</label>
                    <input type="text" id="i-number" maxlength="19" placeholder="1234 3478 9876 3657">
                </div>
                <div class="input-group">
                    <label>Titular de la Tarjeta</label>
                    <input type="text" id="i-name" placeholder="Nombre Completo">
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Fecha de Expiración</label>
                        <div class="expiry-inputs">
                            <select id="i-month">
                                <option value="" disabled selected>Día</option>
                                <option value="01">01</option>
                                </select>
                            <select id="i-year">
                                <option value="" disabled selected>Año</option>
                                <option value="25">2025</option>
                                <option value="26">2026</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>CVV</label>
                        <input type="text" id="i-cvv" maxlength="3" placeholder="000">
                    </div>
                </div>
                <button class="btn-pay">Pagar Ahora</button>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
