<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Pago</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

<div class="main-wrapper">
    <div class="card-section">
        <div class="card" id="card">
            <div class="card-front">
                <div class="card-header">
                    <svg class="card-chip" viewBox="0 0 50 40" width="45" height="35" xmlns="http://www.w3.org/2000/svg">
                        <rect width="50" height="40" rx="6" fill="#d4af37" />
                        <path d="M0 15h15v10H0zM35 15h15v10H35zM15 0h20v10H15zM15 30h20v10H15z" fill="#c5a030" opacity="0.6"/>
                        <path d="M15 10v20M35 10v20M10 15h30M10 25h30" stroke="#b8860b" stroke-width="1.5" fill="none"/>
                    </svg>
                    
                    <svg class="nfc-icon-img" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5.5 16.5c-2.3-3.2-2.3-7.8 0-11M9 14.5c-1.2-1.9-1.2-4.1 0-6M12.5 12.5c-.3-.7-.3-1.3 0-2M16 19.5c4.8-5 4.8-12.5 0-17.5" />
                    </svg>
                </div>
                
                <div class="card-number-display" id="card-num-display">#### #### #### ####</div>
                
                <div class="card-footer">
                    <div class="info-group titular">
                        <span class="label">TITULAR</span>
                        <div id="card-name-display" class="value">NOMBRE COMPLETO</div>
                    </div>
                    <div class="info-group expiracion">
                        <span class="label">EXPIRACION</span>
                        <div id="card-exp-display" class="value">MM/YY</div>
                    </div>
                    <div class="bank-logo-container" id="bank-logo-display">
                        </div>
                </div>
            </div>

            <div class="card-back">
                <div class="magnetic-strip"></div>
                <div class="back-body">
                    <div class="signature-row">
                        <div class="world-icon">
                            <svg viewBox="0 0 24 24" width="28" fill="#5d6d7e"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        </div>
                        <div class="white-bar-container">
                            <div class="signature-fill">
                                <span id="card-last-digits">7345</span>
                            </div>
                            <div class="cvv-box-display" id="card-cvv-display">000</div>
                        </div>
                        <span class="cvv-text-label">CVV</span>
                    </div>
                    <p class="legal-text">
                        Esta tarjeta es propiedad del banco emisor y es intransferible. Su uso implica la aceptación de los términos y condiciones establecidos en el contrato correspondiente.
                    </p>
                    <div class="footer-logo">
                        <div class="small-circle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="payment-form">
        <h2 class="form-title">Detalles de Pago</h2>
        
        <div class="input-field">
            <label>Monto de Pago</label>
            <input type="text" placeholder="$">
        </div>
        <div class="input-field">
            <label>Número de Tarjeta</label>
            <input type="text" id="input-number" maxlength="19" placeholder="1234 3478 9876 3657">
        </div>
        <div class="input-field">
            <label>Titular de la Tarjeta</label>
            <input type="text" id="input-name" placeholder="Nombre Completo">
        </div>
        
        <div class="form-row">
            <div class="input-field exp-group">
                <label>Fecha de Expiracion</label>
                <div class="select-wrapper">
                    <select id="select-day">
                        <option value="" disabled selected>Día</option>
                    </select>
                    <select id="select-year">
                        <option value="" disabled selected>Año</option>
                    </select>
                </div>
            </div>
            <div class="input-field cvv-group">
                <label>CVV</label>
                <input type="text" id="input-cvv" maxlength="3" placeholder="000">
            </div>
        </div>

        <button class="pay-button">Pagar Ahora</button>
    </div>
</div>

<script src="./assets/js/script.js"></script>
</body>
</html>
